<h2>Login Form</h2>

<form (ngSubmit)="loginHandler()">
  <div>
    <label>Username:</label>
    <!-- the purpose of ngModel is to bind the input value to the component's state -->
    <!-- the name attribute is necessary for sending the server form data -->
    <input type="text" [(ngModel)]="username" name="username" required />
  </div>

  <div>
    <label>Password:</label>
    <input type="password" [(ngModel)]="password" name="password" required />
  </div>

  <button type="submit">Login</button>
</form>
